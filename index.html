<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dev-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michael Carmelino</title>
    <script>
      // Siempre dark por defecto, salvo que el usuario haya elegido light explícitamente
      const saved = localStorage.getItem('darkMode');
      if (saved !== 'false') {
        document.documentElement.classList.add('dark');
        localStorage.setItem('darkMode', 'true');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
